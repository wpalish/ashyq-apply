[mypy]
python_version = 3.12
ignore_missing_imports = True
plugins = pydantic.mypy
# The domain core is where a type error becomes a wrong answer, so it is
# checked strictly. Adapters and the pipeline lean on Pydantic's runtime
# coercion (a "2027-05-25" string really is a date once validated), which
# static analysis reads as an error while the value is correct.
files = app

[mypy-app.adapters.browser]
# Playwright objects are created lazily and are None until first use.
disable_error_code = union-attr, assignment, attr-defined

[mypy-app.pipeline.queue]
# The job handle is deliberately either an asyncio.Task or a concurrent Future.
disable_error_code = attr-defined

[mypy-app.corpus.*]
disable_error_code = arg-type, index

[mypy-app.api.*]
disable_error_code = arg-type
