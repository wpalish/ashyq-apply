<h1>Tuition fees and funding</h1>
<p>Tuition for international students is set annually and a non-refundable
$50 application fee covers processing of the file</p>
<p>The tuition fee for the bachelor programme is $4,500 per academic year.</p>
<p>On-campus housing is $300 per month and a meal plan is $260 per month.</p>
