server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the server version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy is invisible until a hard reload.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The API is same-origin, so no CORS and no API base URL in the client.
    location /api/ {
        proxy_pass http://api:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A research run is long; do not cut it off mid-request.
        proxy_read_timeout 300s;
    }

    # The scrape endpoint is for the internal network only. Nothing proxies it
    # today - only /api/ is passed through - but saying so here means a future
    # broader proxy rule cannot publish it by accident.
    location = /metrics {
        return 404;
    }

    # Client-side routing: unknown paths fall through to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
