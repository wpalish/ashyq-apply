name: release-gates

on:
  # `push:` and `pull_request:` together ran the whole matrix twice for every
  # commit on a branch with an open PR — two identical runs, double the
  # minutes, and two links to reconcile when reading results.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit supersedes the run before it. Nothing is learned from finishing
# a run against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      # Failures are annotated, because job logs need repository admin rights to
      # download and a bare "Process completed with exit code 1" is not enough
      # to act on. Annotations are readable through the public API.
      - if: matrix.database == 'sqlite'
        run: |
          set -o pipefail
          .venv/bin/ruff check . 2>&1 | tee /tmp/ruff.txt || {
            while IFS= read -r line; do echo "::error title=ruff::$line"; done < <(head -20 /tmp/ruff.txt)
            exit 1
          }
          .venv/bin/mypy app tests scripts 2>&1 | tee /tmp/mypy.txt || {
            while IFS= read -r line; do echo "::error title=mypy::$line"; done < <(grep error: /tmp/mypy.txt | head -20)
            exit 1
          }
          UNIMATCH_DATABASE_URL=sqlite:////tmp/unimatch-ci.db \
            .venv/bin/pytest --cov=app --cov-fail-under=90 -q 2>&1 | tee /tmp/pytest.txt || {
            while IFS= read -r line; do echo "::error title=pytest (sqlite)::$line"; done < <(
              grep -E '^(FAILED|ERROR)|Coverage failure|Required test coverage' /tmp/pytest.txt | head -20
            )
            exit 1
          }
      - if: matrix.database == 'postgresql'
        run: |
          set -o pipefail
          .venv/bin/python scripts/pg.py .venv/bin/pytest -q 2>&1 | tee /tmp/pytest-pg.txt || {
            while IFS= read -r line; do echo "::error title=pytest (postgresql)::$line"; done < <(
              grep -E '^(FAILED|ERROR)' /tmp/pytest-pg.txt | head -20
            )
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend -- --run
      - run: npm run build --prefix frontend
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run e2e --prefix frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  security-and-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
      - run: POSTGRES_PASSWORD=ci-only-not-a-secret docker compose config --quiet
      - run: POSTGRES_PASSWORD=ci-only-not-a-secret docker compose build

  # Building an image proves it compiles, not that the stack runs. This job
  # starts the whole thing and exercises health, the one-shot migration, a real
  # run picked up by the worker, worker-kill recovery, API restart, tenant
  # isolation, security headers and a backup/restore drill.
  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Production-shaped runtime smoke test
        run: ./scripts/compose_smoke.sh
      # Always, not just on failure: a passing run's health log is what proves
      # the gate actually exercised the stack. The script collects these before
      # it tears the stack down — the previous step ran afterwards, against a
      # project name built from a different shell's $$, and found nothing.
      # An attestation of what this exact commit was verified to do, produced
      # by CI rather than checked in. A JSON file in the repository can only
      # ever describe a commit before itself; this one is keyed by the SHA that
      # was actually tested, and nobody can edit it after the fact.
      - name: Record the container-runtime result for this SHA
        if: always()
        run: |
          mkdir -p /tmp/ashyq-smoke-artifacts
          cat > /tmp/ashyq-smoke-artifacts/attestation.json <<JSON
          {
            "gate": "container_runtime",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "command": "./scripts/compose_smoke.sh",
            "result": "${{ job.status }}",
            "runner": "${{ runner.os }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat /tmp/ashyq-smoke-artifacts/attestation.json

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-runtime-diagnostics-${{ github.sha }}
          path: /tmp/ashyq-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14
