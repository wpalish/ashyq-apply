# A live benchmark capture, on demand.
#
# The strict score compares a *frozen snapshot* of one real pipeline run
# against the certified corpus. Everything Phase 2 built — a claim's scope,
# refusing a claim about another intake, the questions that refusal produces —
# landed after the current snapshot was taken, so the numbers cannot move
# until a new one exists. Taking one needs ordinary internet access, which the
# agent's container does not have: `Fetcher` pins its own IPs and refuses the
# proxy, by design.
#
# This is that run, on a machine that does have internet. It is manual only:
# it fetches live university pages, so nobody should trigger it by pushing.
#
# It never commits anything. The capture and the metrics come back as an
# artifact, for a human to read and decide about.
name: benchmark-capture
run-name: research ${{ inputs.mode || 'benchmark' }} ${{ inputs.case || 'cohort' }} ${{ inputs.run_tag || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where the live reads happen: ubuntu-latest (GitHub cloud) or self-hosted (the owner''s computer). Sites see this machine''s IP.'
        required: false
        default: 'ubuntu-latest'
      case:
        description: 'One case id, or blank for the ten cohort cases: cohort (groningen, delft, aalto, vienna, warsaw, ubc, toronto, hku, ntu, kaist), heldout (nu, metu, sabanci, charles, masaryk, tum, tartu, polimi, vilnius) or dev2, which have no registry entry (ethz, psaclay, uppsala, tcd, tsinghua, tec, uba, kaznu, uct, khalifa), or dev4 (ctu, vut, rwth, kit, unibo, taltech, ktu, boun, itu), or dev5 (kbtu, satbayev, aitu, hacettepe, bilkent, ytu, upol, zcu, tud, lmu, unipd, sapienza, vilniustech). expert_paired takes a space-separated list'
        required: false
        default: ''
      seconds_per_case:
        description: 'Wall-clock budget per university, in seconds (120 since 2026-09-24; 90 matches the frozen baseline)'
        required: false
        default: '120'
      max_pages:
        description: 'Fetcher calls per university (60 matches the frozen baseline)'
        required: false
        default: '60'
      mode:
        description: 'benchmark (default), expert_baseline, expert_actions, expert_paired, verify_evidence (check expert draft quotes with the production fetcher; extra_args = drafts path), or query_probe (v3-M5 Serper query-shape probe, at most 300 queries; extra_args = probe flags, e.g. --cases uba puc), or index_ceiling (free-search 04: dev gold and KB evidence URLs in sitemaps / two hops; no search provider; extra_args = tool flags, e.g. --refused-from <report.json>)'
        required: false
        default: 'benchmark'
      plan:
        description: 'expert_actions: the plan JSON (evaluation/research/expert/controller.py)'
        required: false
        default: ''
      resume_run_id:
        description: 'expert_actions: restore prior raw logs from this repository run; plan must carry its resume_summary'
        required: false
        default: ''
      run_tag:
        description: 'Public audit correlation token, used only in the workflow display title'
        required: false
        default: ''
      extra_args:
        description: 'expert_baseline: extra evaluation.research.live flags; expert_paired: the switch under test'
        required: false
        default: ''
      base_args:
        description: 'expert_paired: flags applied to BOTH arms, so only extra_args differs'
        required: false
        default: ''
      case_parallelism:
        description: 'expert_paired: universities captured at once (1 = the old serial two-pass order). Each university keeps its own off/on/on/off order; different universities are different sites, so no site sees more requests. 5 since run 39076880836: same labels as serial, 12 min instead of 45, no wall-clock timeouts'
        required: false
        default: '5'
      columns:
        description: 'expert_paired: captures per case. 4 = the ABBA pair (off/on/on/off); 1 = a single-column record run, one "on" capture per case (base_args + extra_args; leave extra_args empty for the default pipeline), so a list of N cases plans 6 x N queries. A record run on a keyed provider also builds out/recorded_search.<run_tag or record>.json (recorded-search/2)'
        type: choice
        required: false
        default: '4'
        options:
          - '4'
          - '1'
      search_first:
        description: 'Experiment: search before the navigation fallback (false matches the measured default)'
        required: false
        default: 'false'
      max_search_queries:
        description: 'The run''s hard cap on provider queries (free-search ticket 02). Required for every search layer but none and recorded: the run refuses to start when it plans more (6 per case per capture, x4 for expert_paired, +1 for the Serper pre-flight), and the query after the cap is refused with no request sent'
        required: false
        default: ''
      search_provider:
        description: 'Search layer: auto preserves historic secret precedence; explicit exa, tavily or brave requires its UNIMATCH_<PROVIDER>_API_KEY secret (the job stops before any capture without it); recorded (expert modes) replays the recorded Serper lists of the dev sets, no provider called and no key read (store: --recorded-store PATH in base_args, else evaluation/research/data/recorded_search.base3.json). "--search-provider recorded" in base_args or extra_args selects it too, for both arms'
        type: choice
        required: false
        default: 'auto'
        options:
          - auto
          - exa
          - exa_mcp
          - tavily
          - brave
          - none
          - recorded

permissions:
  contents: read

jobs:
  capture:
    if: inputs.mode == 'benchmark' || inputs.mode == ''
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # Ten universities at a two-minute budget each, plus install and scoring.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      # The search provider is part of the pipeline under measurement. With no
      # key the run still completes — discovery falls back to sitemaps and the
      # catalogue walker — but it measures a different pipeline, so the step
      # below says which one it measured.
      # Tavily first when its key is set: the Exa account answered 402 on every
      # query in run 48, and a spent balance must not silently remove search.
      # Serper, then Brave, then Tavily, then Exa: Tavily's free plan answered
      # 432 on every query in runs 68-69.
      UNIMATCH_EXA_API_KEY: ${{ secrets.UNIMATCH_EXA_API_KEY }}
      UNIMATCH_TAVILY_API_KEY: ${{ secrets.UNIMATCH_TAVILY_API_KEY }}
      UNIMATCH_BRAVE_API_KEY: ${{ secrets.UNIMATCH_BRAVE_API_KEY }}
      UNIMATCH_SERPER_API_KEY: ${{ secrets.UNIMATCH_SERPER_API_KEY }}
      # Phase 4 shadow: a decision model only ranks, and only into the log.
      UNIMATCH_DECISION_PROVIDER: ${{ secrets.UNIMATCH_TYPESAFE_API_KEY != '' && 'typesafe' || 'none' }}
      UNIMATCH_TYPESAFE_API_KEY: ${{ secrets.UNIMATCH_TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt

      - name: Select the search layer
        env:
          REQUESTED_SEARCH_PROVIDER: ${{ inputs.search_provider || 'auto' }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_SEARCH_PROVIDER"
          decided_by="explicit input"
          case "$requested" in
            auto)
              if [ -n "$UNIMATCH_SERPER_API_KEY" ]; then
                provider=serper; decided_by=UNIMATCH_SERPER_API_KEY
              elif [ -n "$UNIMATCH_BRAVE_API_KEY" ]; then
                provider=brave; decided_by=UNIMATCH_BRAVE_API_KEY
              elif [ -n "$UNIMATCH_TAVILY_API_KEY" ]; then
                provider=tavily; decided_by=UNIMATCH_TAVILY_API_KEY
              elif [ -n "$UNIMATCH_EXA_API_KEY" ]; then
                provider=exa; decided_by=UNIMATCH_EXA_API_KEY
              else
                provider=none; decided_by="no configured search key"
              fi
              ;;
            exa)
              if [ -z "$UNIMATCH_EXA_API_KEY" ]; then
                echo "::error::exa requires UNIMATCH_EXA_API_KEY; no capture started"
                exit 1
              fi
              provider=exa; decided_by="explicit input and UNIMATCH_EXA_API_KEY"
              ;;
            tavily)
              if [ -z "$UNIMATCH_TAVILY_API_KEY" ]; then
                echo "::error::tavily requires UNIMATCH_TAVILY_API_KEY; no capture started"
                exit 1
              fi
              provider=tavily; decided_by="explicit input and UNIMATCH_TAVILY_API_KEY"
              ;;
            brave)
              if [ -z "$UNIMATCH_BRAVE_API_KEY" ]; then
                echo "::error::brave requires UNIMATCH_BRAVE_API_KEY; no capture started"
                exit 1
              fi
              provider=brave; decided_by="explicit input and UNIMATCH_BRAVE_API_KEY"
              ;;
            exa_mcp|none) provider="$requested" ;;
            *) echo "::error::unknown search_provider; no capture started"; exit 1 ;;
          esac
          echo "UNIMATCH_SEARCH_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "search provider: $provider (decided by $decided_by)"
          mkdir -p out
          echo "provider=$provider" > out/config.txt
          echo "decided_by=$decided_by" >> out/config.txt

      - name: Search query cap (refuse a provider run without one)
        # Free-search ticket 02. Every query a keyed or keyless provider
        # answers can spend an allowance or a paid key, and the 2026-10-19
        # outage spent eight runs before anyone read the logs. So a run on any
        # provider but none/recorded names its cap, its plan must fit under it,
        # and every capture of the run charges one shared ledger.
        env:
          REQUESTED_CAP: ${{ inputs.max_search_queries }}
          REQUESTED_CASE: ${{ inputs.case }}
          REQUESTED_MODE: benchmark
        run: |
          set -euo pipefail
          mkdir -p out
          # none/recorded send nothing, so they need no cap; given one anyway,
          # the plan is still checked against it (a dry run of a record run's
          # guard) and no ledger is passed on.
          dry=""
          case "$UNIMATCH_SEARCH_PROVIDER" in
            none|recorded)
              if [ -z "$REQUESTED_CAP" ]; then
                echo "search query cap: not needed ($UNIMATCH_SEARCH_PROVIDER sends no provider query)"
                echo "SEARCH_CAP_ARGS=" >> "$GITHUB_ENV"
                echo "max_search_queries=uncapped ($UNIMATCH_SEARCH_PROVIDER)" >> out/config.txt
                exit 0
              fi
              dry=yes
              ;;
          esac
          if ! [[ "$REQUESTED_CAP" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::search provider $UNIMATCH_SEARCH_PROVIDER needs the max_search_queries input (a positive integer): the run's hard cap on provider queries. No capture started, nothing was sent."
            exit 1
          fi
          read -r -a cases <<< "$REQUESTED_CASE"
          count=${#cases[@]}
          if [ "$count" -eq 0 ]; then
            read -r -a cases <<< "$(.venv/bin/python -c 'from evaluation.research.live import COHORT; print(" ".join(COHORT))')"
            count=${#cases[@]}
          fi
          columns=1; extra=0
          if [ "$REQUESTED_MODE" = expert_paired ]; then
            # W4: a single-column record run captures each case once.
            columns="${REQUESTED_COLUMNS:-4}"
            case "$columns" in
              1|4) ;;
              *) echo "::error::columns must be 4 (ABBA pair) or 1 (record run), got '$columns'. No capture started, nothing was sent."; exit 1 ;;
            esac
            [ "$UNIMATCH_SEARCH_PROVIDER" = serper ] && extra=1
          fi
          planned=$(( 6 * count * columns + extra ))
          if [ "$planned" -gt "$REQUESTED_CAP" ]; then
            echo "::error::the run plans $planned provider queries ($count case(s) x $columns capture(s) x 6 + $extra pre-flight) but max_search_queries is $REQUESTED_CAP. No capture started, nothing was sent."
            exit 1
          fi
          if [ -n "$dry" ]; then
            echo "search query cap: $REQUESTED_CAP covers the plan of $planned ($UNIMATCH_SEARCH_PROVIDER sends nothing; no ledger)"
            echo "SEARCH_CAP_ARGS=" >> "$GITHUB_ENV"
            echo "max_search_queries=$REQUESTED_CAP planned=$planned provider=$UNIMATCH_SEARCH_PROVIDER dry=yes" >> out/config.txt
            exit 0
          fi
          echo "SEARCH_CAP_ARGS=--max-search-queries $REQUESTED_CAP --search-ledger $PWD/out/search_ledger.json" >> "$GITHUB_ENV"
          echo "search query cap: $REQUESTED_CAP for $UNIMATCH_SEARCH_PROVIDER (planned $planned)"
          echo "max_search_queries=$REQUESTED_CAP planned=$planned provider=$UNIMATCH_SEARCH_PROVIDER" >> out/config.txt

      - name: Say which pipeline is being measured
        run: |
          echo "runner=${{ runner.name }} os=${{ runner.os }} environment=${{ runner.environment }}"
          echo "search provider: $UNIMATCH_SEARCH_PROVIDER"

      - name: Capture
        # The bounds are printed, not assumed: a capture taken under different
        # budgets is a different measurement, and the frozen baseline's are 60
        # Fetcher calls and 90 seconds per university.
        #
        # SR-05: inputs reach the shell only through env and are validated
        # before use, never expanded into the script text.
        env:
          REQUESTED_CASE: ${{ inputs.case }}
          MAX_PAGES: ${{ inputs.max_pages }}
          SECONDS_PER_CASE: ${{ inputs.seconds_per_case }}
          SEARCH_FIRST: ${{ inputs.search_first }}
        run: |
          set -o pipefail
          case_re='^[a-z0-9 ]*$'
          if ! [[ "$REQUESTED_CASE" =~ $case_re ]]; then
            echo "::error::case must match $case_re"
            exit 1
          fi
          if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ && "$SECONDS_PER_CASE" =~ ^[0-9]+$ ]]; then
            echo "::error::max_pages and seconds_per_case must be whole numbers"
            exit 1
          fi
          run_flags=()
          # Expressions compare strings case-insensitively; so does this.
          if [ "${SEARCH_FIRST,,}" = true ]; then run_flags+=(--search-first); fi
          if [ -n "$REQUESTED_CASE" ]; then
            read -r -a case_words <<< "$REQUESTED_CASE"
            run_flags+=(--case ${case_words[@]+"${case_words[@]}"})
          fi
          echo "budgets: $MAX_PAGES page reads / ${SECONDS_PER_CASE}s per case"
          echo "The page budget bounds Fetcher.get calls, not HTTP requests: one read can"
          echo "issue several (redirects, the browser tier, a PDF). Run 35697105238 made 98"
          echo "requests for one case under a budget of 60, so the 'http' column below is"
          echo "traffic, not the bound."
          .venv/bin/python -m evaluation.research.live \
            --live \
            --out evaluation/research/baseline/capture.${{ github.run_id }} \
            --seconds-per-case "$SECONDS_PER_CASE" \
            --max-pages "$MAX_PAGES" \
            ${run_flags[@]+"${run_flags[@]}"} \
            --search-provider "$UNIMATCH_SEARCH_PROVIDER" ${SEARCH_CAP_ARGS:-} \
            | tee capture.log
          # The capture writes into a timestamped subdirectory and prints that
          # path as its last line. Reading it back is the only way to name the
          # file; guessing it is what made run #1 score nothing at all.
          echo "CAPTURE_JSON=$(tail -n 1 capture.log)" >> "$GITHUB_ENV"

      - name: Score it strictly against the certified corpus
        # Strict: no --allow-drafts. The corpus is human-signed, so a
        # provisional score would be a step backwards from V2-01.
        #
        # pipefail, and the file is checked before it is used: run #1 failed
        # here with FileNotFoundError, `tee` returned 0, the step went green
        # and the comparison below printed a committed draft report as if it
        # were the measurement. A measurement that cannot fail loudly is worse
        # than no measurement.
        run: |
          set -o pipefail
          test -f "$CAPTURE_JSON" || { echo "no capture at $CAPTURE_JSON"; exit 1; }
          .venv/bin/python -m evaluation.research \
            --dataset evaluation/research/data/ground_truth.reviewed.json \
            --capture "$CAPTURE_JSON" \
            --out evaluation/research/baseline/metrics.${{ github.run_id }}.json \
            | tee capture-metrics.txt

      - name: Read every certified fact from its own source page
        # The oracle: fetch each labelled URL directly, with no discovery at
        # all, and ask whether the extractor can recover the fact. That splits
        # "never found the page" from "found it and could not read it", which
        # claim_recall alone has never done. 24 distinct URLs, so it is cheap.
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          .venv/bin/python -m evaluation.research.oracle \
            --dataset evaluation/research/data/ground_truth.reviewed.json \
            --live \
            --cache .cache/oracle \
            --json oracle.json | tee oracle.txt

      - name: Say how many certified facts could ever be scored
        # claim_recall's denominator counts every known label, but a label no
        # claim type maps to, or an award or document whose identity is not
        # bound, scores zero whatever extraction does. Read recall against
        # this ceiling, not against the raw count.
        run: |
          .venv/bin/python -m evaluation.research.expressibility \
            --dataset evaluation/research/data/ground_truth.reviewed.json \
            --bindings evaluation/research/data/identity_bindings.reviewed.json

      - name: Say why a right-valued claim was not supported
        # Supported means our quote lies inside the reviewer's. Reviewers quote
        # the least that proves a fact; we quote a window around it. This shows
        # which way each right-valued quote relates, so the direction can be
        # settled on evidence.
        run: |
          set -o pipefail
          .venv/bin/python -m evaluation.research.support_report \
            --dataset evaluation/research/data/ground_truth.reviewed.json \
            --capture "$CAPTURE_JSON" | tee support-shapes.txt

      - name: Say why each scope mismatch happened
        # The rate alone cannot be acted on: a page that stated the wrong
        # population and a page that stated nothing score identically, and the
        # fix for one is nothing like the fix for the other.
        run: |
          set -o pipefail
          .venv/bin/python -m evaluation.research.scope_report \
            --dataset evaluation/research/data/ground_truth.reviewed.json \
            --capture "$CAPTURE_JSON" \
            --json scope-mismatches.json | tee scope-mismatches.txt

      - name: Show what moved
        # Printed in the log so the numbers are readable without downloading
        # anything. The comparison a human actually wants is against
        # metrics.reviewed.json, which is committed.
        #
        # The new report is named exactly, never globbed: run #1 globbed
        # `metrics.*.json`, took the last one, and printed a committed draft
        # report under the heading "this run".
        run: |
          set -o pipefail
          .venv/bin/python - <<'PY'
          import json, pathlib
          old = json.loads(pathlib.Path("evaluation/research/baseline/metrics.reviewed.json").read_text())["metrics"]
          new = json.loads(pathlib.Path("evaluation/research/baseline/metrics.${{ github.run_id }}.json").read_text())["metrics"]
          print(f"{'metric':45} {'certified':>14} {'this run':>14}")
          for key in sorted(set(old) | set(new)):
              def show(report):
                  entry = report.get(key)
                  if not entry:
                      return "-"
                  return f"{entry['numerator']}/{entry['denominator']}"
              before, after = show(old), show(new)
              flag = "" if before == after else "   <-- moved"
              print(f"{key:45} {before:>14} {after:>14}{flag}")
          PY

      - name: Per-case outcomes
        # Last, deliberately. The capture prints these as it goes, but the
        # metrics JSON in between pushes them out of the log's tail, and a
        # budget exhaustion is exactly what a reader needs when a recall
        # number looks low: it says the pipeline never finished looking.
        run: |
          set -o pipefail
          .venv/bin/python - <<'PY'
          import json, pathlib, os, re
          capture = json.loads(pathlib.Path(os.environ["CAPTURE_JSON"]).read_text())
          print(f"{'case':12} {'outcome':45} {'http':>6} {'claims':>7}")
          budget = 0
          for observation in capture["observations"]:
              error = observation.get("error") or "complete"
              if "BUDGET" in error:
                  budget += 1
              telemetry = observation.get("telemetry") or {}
              print(
                  f"{observation['case_id']:12} {error:45} "
                  f"{telemetry.get('http_fetches', 0):>6} "
                  f"{len(observation.get('predictions') or []):>7}"
              )
          print(f"\n{budget} of {len(capture['observations'])} cases ran out of budget")

          # Where the budget went. A case that ran out of wall clock after two
          # fetches spent its time somewhere other than reading pages; its own
          # child log is the only record, and it sits beside capture.json.
          logs = pathlib.Path(os.environ["CAPTURE_JSON"]).parent
          for observation in capture["observations"]:
              budget_case = "BUDGET" in (observation.get("error") or "")
              if not budget_case and observation.get("predictions") and not observation.get("error"):
                  continue
              telemetry = observation.get("telemetry") or {}
              print(
                  f"\n--- {observation['case_id']}: {observation.get('error')} | "
                  f"http={telemetry.get('http_fetches')} search={telemetry.get('search_calls')} "
                  f"browser={telemetry.get('browser_fetches')} "
                  f"latency={telemetry.get('latency_seconds')}"
              )
              log = logs / f"{observation['case_id']}.log"
              if log.exists():
                  lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
                  failed_case = bool(observation.get("error")) and not budget_case
                  if budget_case:
                      # Every read it started, then the tail: run 63's Groningen
                      # tail showed only science-shops pages, not how it got there.
                      starts = [ln for ln in lines if " start " in ln]
                      others = [ln for ln in lines if " start " not in ln and " took " not in ln]
                      shown = starts[:160] + others[-20:]
                  elif failed_case:
                      # A crash: the traceback is the only record (run 49,
                      # Toronto: "not enough values to unpack").
                      tb = [i for i, ln in enumerate(lines) if "Traceback" in ln]
                      shown = lines[tb[-1]:][:60] if tb else lines[-60:]
                  else:
                      # A case that filed nothing: every read and its outcome,
                      # so a navigation miss shows which pages it went to.
                      shown = [ln for ln in lines if " took " in ln or " start " in ln or "search query failed" in ln][:160]
                  for line in shown:
                      print(f"    {line[:220]}")
              raw = logs / f"{observation['case_id']}.raw.json"
              if not budget_case and raw.exists():
                  # What discovery chose and what the catalogue walker saw:
                  # the read trail says where it went, this says why.
                  try:
                      institutions = json.loads(raw.read_text())["canary"]["institutions"]
                  except (ValueError, KeyError, TypeError):
                      institutions = []
                  for inst in institutions if isinstance(institutions, list) else [institutions]:
                      dtrace = (inst or {}).get("discovery_trace") or {}
                      print(f"    selected: {json.dumps(dtrace.get('selected'))[:600]}")
                      for err in (dtrace.get("errors") or [])[:8]:
                          print(f"    trace: {str(err)[:400]}")
                      walker = dtrace.get("walker") or {}
                      print(f"    walker: catalogs={walker.get('catalogs_walked')} confirmed={walker.get('programs_confirmed')}")
                      for cand in (walker.get("candidates") or [])[:12]:
                          print(f"      cand {cand.get('score')} {str(cand.get('url'))[:110]} | {str(cand.get('label'))[:40]}")
                      # Dropped links (off-site, short labels, furniture) are
                      # counted, not listed: the reads are what explain a miss.
                      dropped = {"off_domain", "short_label", "walker_no_signal", "excluded_url", "degree_level_mismatch", "walker_budget_exhausted"}
                      outs = walker.get("outcomes") or []
                      print(f"      ({sum(1 for o in outs if o.get('outcome') in dropped)} links dropped unread)")
                      for out in [o for o in outs if o.get("outcome") not in dropped][:60]:
                          print(f"      out {out.get('outcome')} {str(out.get('url'))[:110]}")
              else:
                  print("    (no child log)")

          # Why a case filed nothing. Nine of ten cases in run 35697105238
          # produced zero claims and the capture could not say why for any of
          # them; a count of the runner's own five outcomes is the answer.
          print("\nwhy pages produced nothing, per case:")
          for observation in capture["observations"]:
              outcomes = observation.get("page_outcomes") or []
              if not outcomes:
                  print(f"  {observation['case_id']:12} (no per-page records)")
                  continue
              counts = {}
              for record in outcomes:
                  counts[record["category"]] = counts.get(record["category"], 0) + 1
              summary = ", ".join(f"{k}={v}" for k, v in sorted(counts.items()))
              print(f"  {observation['case_id']:12} {summary}")

          # Funding pages for every case: scholarship discovery scored 0/3 through
          # run 55 while cases with claims printed no page detail at all.
          print("\nfunding pages read, per case:")
          for observation in capture["observations"]:
              for record in (observation.get("page_outcomes") or []):
                  url = record.get("url") or ""
                  detail = record.get("detail") or ""
                  if re.search(r"scholar|award|funding|financ|bursar", url + " " + detail, re.I):
                      print(f"  {observation['case_id']:10} {record['category']:20} {url[:100]}  {detail[:140]}")

          # The funding reads themselves, from each case's own trail: run 58 queued
          # twelve NTU award links and no outcome for any of them was recorded.
          print("\nfunding reads in each case's trail:")
          for observation in capture["observations"]:
              log = logs / f"{observation['case_id']}.log"
              if not log.exists():
                  continue
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              for ln in lines:
                  if ln.startswith("jev shadow:"):
                      print(f"  {observation['case_id']:10} {ln}")
              hits = [ln for ln in lines if re.search(r"scholar|award|bursar", ln, re.I)]
              for ln in hits[:30]:
                  print(f"  {observation['case_id']:10} {ln[:200]}")

          # A case that filed nothing: every page it read, and what became of it.
          for observation in capture["observations"]:
              if observation.get("predictions"):
                  continue
              print(f"\n  {observation['case_id']}: no claims; its pages:")
              for record in (observation.get("page_outcomes") or [])[:25]:
                  detail = (record.get("detail") or "")[:260]
                  print(f"    {record['category']:20} {record['url'][:110]}  {detail}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-capture-${{ github.run_id }}
          path: |
            backend/evaluation/research/baseline/capture.${{ github.run_id }}
            backend/evaluation/research/baseline/metrics.${{ github.run_id }}.json
            backend/capture-metrics.txt
            backend/capture.log
            backend/out/config.txt
            backend/out/search_ledger.json
            backend/scope-mismatches.json
            backend/scope-mismatches.txt
            backend/support-shapes.txt
            backend/oracle.json
            backend/oracle.txt
          retention-days: 14

  # Expert recovery (backend/evaluation/research/expert): the live half of the
  # protocol. The agent container cannot run Fetcher, so each read happens here
  # and returns in the log as a base64 tarball. expert_baseline does not score.
  expert:
    if: startsWith(inputs.mode, 'expert_')
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: backend
    env:
      UNIMATCH_EXA_API_KEY: ${{ secrets.UNIMATCH_EXA_API_KEY }}
      UNIMATCH_TAVILY_API_KEY: ${{ secrets.UNIMATCH_TAVILY_API_KEY }}
      UNIMATCH_BRAVE_API_KEY: ${{ secrets.UNIMATCH_BRAVE_API_KEY }}
      UNIMATCH_SERPER_API_KEY: ${{ secrets.UNIMATCH_SERPER_API_KEY }}
      UNIMATCH_DEMO_MODE: 'false'
      UNIMATCH_ENABLE_BROWSER_TIER: 'false'
      UNIMATCH_FETCH_CONTACT: 'https://github.com/wpalish/ashyq-apply'
      PLAN_JSON: ${{ inputs.plan }}
      # Measurement M-1: map award claims with the unsigned draft bindings too
      # (cohort/heldout awards in draft2, dev2 awards in dev2-draft1; dev4 awards in
      # dev4-draft3, signed by the owner 2026-10-18, ticket 09; dev5 awards in
      # dev5-draft1, unsigned), loaded
      # after the reviewed file and never overriding it. Passed identically to
      # every capture of this job (baseline, and both paired arms), so a paired
      # comparison stays fair; capture.json records the files under
      # config.identity_bindings.
      MEASUREMENT_BINDINGS: >-
        --extra-bindings evaluation/research/data/identity_bindings.draft2.json
        --extra-bindings evaluation/research/data/identity_bindings.dev2-draft1.json
        --extra-bindings evaluation/research/data/identity_bindings.dev3-draft1.json
        --extra-bindings evaluation/research/data/identity_bindings.dev4-draft3.json
        --extra-bindings evaluation/research/data/identity_bindings.dev5-draft1.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -q -r requirements-dev.txt
      - name: Select the search layer
        env:
          REQUESTED_SEARCH_PROVIDER: ${{ inputs.search_provider || 'auto' }}
          REQUESTED_BASE_ARGS: ${{ inputs.base_args }}
          REQUESTED_EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_SEARCH_PROVIDER"
          decided_by="explicit input"
          # Recorded-search replay (owner, 2026-10-19: paid search frozen). Named
          # in base_args or extra_args, it is the search layer of BOTH arms: a
          # pair whose arms searched differently would measure the provider.
          read -r -a named <<< "$REQUESTED_BASE_ARGS $REQUESTED_EXTRA_ARGS"
          store=""
          for i in "${!named[@]}"; do
            case "${named[$i]}" in
              --search-provider=recorded) requested=recorded; decided_by="--search-provider recorded" ;;
              --search-provider) [ "${named[$((i+1))]:-}" = recorded ] && { requested=recorded; decided_by="--search-provider recorded"; } ;;
              --recorded-store=*) store="${named[$i]#--recorded-store=}" ;;
              --recorded-store) store="${named[$((i+1))]:-}" ;;
            esac
          done
          if [ "$requested" = recorded ]; then
            store="${store:-evaluation/research/data/recorded_search.base3.json}"
            if [ ! -f "$store" ]; then
              echo "::error::recorded search store not found: $store; no capture started"
              exit 1
            fi
            # Both arms replay the same store; no paid key reaches any later step.
            echo "UNIMATCH_SEARCH_PROVIDER=recorded" >> "$GITHUB_ENV"
            echo "UNIMATCH_RECORDED_SEARCH_STORE=$store" >> "$GITHUB_ENV"
            for key in UNIMATCH_EXA_API_KEY UNIMATCH_TAVILY_API_KEY UNIMATCH_BRAVE_API_KEY UNIMATCH_SERPER_API_KEY; do
              echo "$key=" >> "$GITHUB_ENV"
            done
            echo "search provider: recorded (decided by $decided_by; store $store; no provider is called)"
            mkdir -p out
            echo "provider=recorded" > out/config.txt
            echo "decided_by=$decided_by" >> out/config.txt
            echo "recorded_store=$store sha256=$(sha256sum "$store" | cut -d' ' -f1)" >> out/config.txt
            exit 0
          fi
          case "$requested" in
            auto)
              if [ -n "$UNIMATCH_SERPER_API_KEY" ]; then
                provider=serper; decided_by=UNIMATCH_SERPER_API_KEY
              elif [ -n "$UNIMATCH_BRAVE_API_KEY" ]; then
                provider=brave; decided_by=UNIMATCH_BRAVE_API_KEY
              elif [ -n "$UNIMATCH_TAVILY_API_KEY" ]; then
                provider=tavily; decided_by=UNIMATCH_TAVILY_API_KEY
              elif [ -n "$UNIMATCH_EXA_API_KEY" ]; then
                provider=exa; decided_by=UNIMATCH_EXA_API_KEY
              else
                provider=none; decided_by="no configured search key"
              fi
              ;;
            exa)
              if [ -z "$UNIMATCH_EXA_API_KEY" ]; then
                echo "::error::exa requires UNIMATCH_EXA_API_KEY; no capture started"
                exit 1
              fi
              provider=exa; decided_by="explicit input and UNIMATCH_EXA_API_KEY"
              ;;
            tavily)
              if [ -z "$UNIMATCH_TAVILY_API_KEY" ]; then
                echo "::error::tavily requires UNIMATCH_TAVILY_API_KEY; no capture started"
                exit 1
              fi
              provider=tavily; decided_by="explicit input and UNIMATCH_TAVILY_API_KEY"
              ;;
            brave)
              if [ -z "$UNIMATCH_BRAVE_API_KEY" ]; then
                echo "::error::brave requires UNIMATCH_BRAVE_API_KEY; no capture started"
                exit 1
              fi
              provider=brave; decided_by="explicit input and UNIMATCH_BRAVE_API_KEY"
              ;;
            exa_mcp|none) provider="$requested" ;;
            *) echo "::error::unknown search_provider; no capture started"; exit 1 ;;
          esac
          echo "UNIMATCH_SEARCH_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "search provider: $provider (decided by $decided_by)"
          mkdir -p out
          echo "provider=$provider" > out/config.txt
          echo "decided_by=$decided_by" >> out/config.txt

      - name: Search query cap (refuse a provider run without one)
        if: inputs.mode != 'expert_actions'
        # Free-search ticket 02. Every query a keyed or keyless provider
        # answers can spend an allowance or a paid key, and the 2026-10-19
        # outage spent eight runs before anyone read the logs. So a run on any
        # provider but none/recorded names its cap, its plan must fit under it,
        # and every capture of the run charges one shared ledger.
        env:
          REQUESTED_CAP: ${{ inputs.max_search_queries }}
          REQUESTED_CASE: ${{ inputs.case }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_COLUMNS: ${{ inputs.columns || '4' }}
        run: |
          set -euo pipefail
          mkdir -p out
          # none/recorded send nothing, so they need no cap; given one anyway,
          # the plan is still checked against it (a dry run of a record run's
          # guard) and no ledger is passed on.
          dry=""
          case "$UNIMATCH_SEARCH_PROVIDER" in
            none|recorded)
              if [ -z "$REQUESTED_CAP" ]; then
                echo "search query cap: not needed ($UNIMATCH_SEARCH_PROVIDER sends no provider query)"
                echo "SEARCH_CAP_ARGS=" >> "$GITHUB_ENV"
                echo "max_search_queries=uncapped ($UNIMATCH_SEARCH_PROVIDER)" >> out/config.txt
                exit 0
              fi
              dry=yes
              ;;
          esac
          if ! [[ "$REQUESTED_CAP" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::search provider $UNIMATCH_SEARCH_PROVIDER needs the max_search_queries input (a positive integer): the run's hard cap on provider queries. No capture started, nothing was sent."
            exit 1
          fi
          read -r -a cases <<< "$REQUESTED_CASE"
          count=${#cases[@]}
          if [ "$count" -eq 0 ]; then
            read -r -a cases <<< "$(.venv/bin/python -c 'from evaluation.research.live import COHORT; print(" ".join(COHORT))')"
            count=${#cases[@]}
          fi
          columns=1; extra=0
          if [ "$REQUESTED_MODE" = expert_paired ]; then
            # W4: a single-column record run captures each case once.
            columns="${REQUESTED_COLUMNS:-4}"
            case "$columns" in
              1|4) ;;
              *) echo "::error::columns must be 4 (ABBA pair) or 1 (record run), got '$columns'. No capture started, nothing was sent."; exit 1 ;;
            esac
            [ "$UNIMATCH_SEARCH_PROVIDER" = serper ] && extra=1
          fi
          planned=$(( 6 * count * columns + extra ))
          if [ "$planned" -gt "$REQUESTED_CAP" ]; then
            echo "::error::the run plans $planned provider queries ($count case(s) x $columns capture(s) x 6 + $extra pre-flight) but max_search_queries is $REQUESTED_CAP. No capture started, nothing was sent."
            exit 1
          fi
          if [ -n "$dry" ]; then
            echo "search query cap: $REQUESTED_CAP covers the plan of $planned ($UNIMATCH_SEARCH_PROVIDER sends nothing; no ledger)"
            echo "SEARCH_CAP_ARGS=" >> "$GITHUB_ENV"
            echo "max_search_queries=$REQUESTED_CAP planned=$planned provider=$UNIMATCH_SEARCH_PROVIDER dry=yes" >> out/config.txt
            exit 0
          fi
          echo "SEARCH_CAP_ARGS=--max-search-queries $REQUESTED_CAP --search-ledger $PWD/out/search_ledger.json" >> "$GITHUB_ENV"
          echo "search query cap: $REQUESTED_CAP for $UNIMATCH_SEARCH_PROVIDER (planned $planned)"
          echo "max_search_queries=$REQUESTED_CAP planned=$planned provider=$UNIMATCH_SEARCH_PROVIDER" >> out/config.txt

      - name: Provider
        # Which machine read the sites is part of the measurement: a cloud
        # runner and a home connection get different answers (Aalto's
        # robots.txt timed out from GitHub's cloud 3/3 on 2026-09-27).
        run: |
          echo "search provider=$UNIMATCH_SEARCH_PROVIDER sha=$(git rev-parse HEAD)"
          echo "runner=${{ runner.name }} os=${{ runner.os }} environment=${{ runner.environment }}"

      - name: Baseline capture and blinded packet
        if: inputs.mode == 'expert_baseline'
        env:
          REQUESTED_CASE: ${{ inputs.case }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
          MAX_PAGES: ${{ inputs.max_pages }}
          SECONDS_PER_CASE: ${{ inputs.seconds_per_case }}
        run: |
          set -euo pipefail
          case_re='^[a-z0-9 ]*$'
          if ! [[ "$REQUESTED_CASE" =~ $case_re ]]; then
            echo "::error::case must match $case_re"
            exit 1
          fi
          if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ && "$SECONDS_PER_CASE" =~ ^[0-9]+$ ]]; then
            echo "::error::max_pages and seconds_per_case must be whole numbers"
            exit 1
          fi
          # Split on whitespace into words; never eval'd, so no shell syntax runs.
          read -r -a extra_flags <<< "$EXTRA_ARGS"
          mkdir -p out
          case_flags=()
          packet_flags=()
          if [ -n "$REQUESTED_CASE" ]; then
            case_flags=(--case "$REQUESTED_CASE")
            packet_flags=(--case "$REQUESTED_CASE")
          else
            # Public cohort IDs only. The expert exporter copies no labels.
            for case_id in $(.venv/bin/python -c 'from evaluation.research.live import COHORT; print(" ".join(COHORT))'); do
              packet_flags+=(--case "$case_id")
            done
          fi
          .venv/bin/python -m evaluation.research.live --live --out out/capture \
            ${case_flags[@]+"${case_flags[@]}"} \
            --seconds-per-case "$SECONDS_PER_CASE" \
            --max-pages "$MAX_PAGES" $MEASUREMENT_BINDINGS ${extra_flags[@]+"${extra_flags[@]}"} \
            --search-provider "$UNIMATCH_SEARCH_PROVIDER" ${SEARCH_CAP_ARGS:-} | tee out/capture.log
          CAPTURE="$(tail -n 1 out/capture.log)"
          test -f "$CAPTURE"
          .venv/bin/python -m evaluation.research.expert prepare \
            --dataset evaluation/research/data/ground_truth.reviewed.json \
            --capture "$CAPTURE" "${packet_flags[@]}" \
            --out out/packet.json
          echo "extra_args=$EXTRA_ARGS bindings=$MEASUREMENT_BINDINGS" >> out/config.txt

      - name: Search pre-flight (one Serper call before any capture)
        if: inputs.mode == 'expert_paired'
        # 2026-10-19: every Serper call answered HTTP 400 for hours and eight
        # paired runs measured the outage as a pipeline result. One query
        # through the product client first; on failure the job stops here with
        # the provider's status and capped error body (the key is masked by
        # the adapter and never printed), before any budget is spent.
        run: |
          set -o pipefail
          if [ "$UNIMATCH_SEARCH_PROVIDER" = recorded ]; then
            echo "search pre-flight skipped: recorded-search replay, no provider is called"
            exit 0
          fi
          if [ "$UNIMATCH_SEARCH_PROVIDER" != serper ]; then
            echo "search pre-flight skipped: provider is $UNIMATCH_SEARCH_PROVIDER"
            exit 0
          fi
          if ! .venv/bin/python -m evaluation.research.search_preflight ${SEARCH_CAP_ARGS:-} 2> out/preflight.err; then
            echo "::error::$(cat out/preflight.err)"
            exit 1
          fi

      - name: Paired rule experiment (same runner, ABBA order)
        if: inputs.mode == 'expert_paired'
        env:
          PAIRED_COLUMNS: ${{ inputs.columns || '4' }}
          REQUESTED_CASE: ${{ inputs.case }}
          BASE_ARGS: ${{ inputs.base_args }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
          MAX_PAGES: ${{ inputs.max_pages }}
          SECONDS_PER_CASE: ${{ inputs.seconds_per_case }}
          CASE_PARALLELISM: ${{ inputs.case_parallelism }}
        # inputs.case is a space-separated list; inputs.extra_args is the rule
        # switch under test. Each case still runs off/on/on/off so a drift in
        # the site or provider hits both arms alike, but in two passes: the
        # list forwards (off, on), then reversed (on, off). The keyless search
        # quota runs out late in a job, and with case-major order the last
        # cases (NTU, KAIST) met it in every repetition (runs of 2026-10-06);
        # now every case has one early and one late pass.
        #
        # columns=1 (W4, the record run): one "on" capture per case and no
        # "off" arm, so a list of N cases costs at most 6 x N queries. The
        # captures keep <case>.search.json, which the next step turns into a
        # recorded-search/2 store.
        run: |
          set -o pipefail
          # SR-05: inputs arrive through env (exported, so the xargs children
          # see them too), are validated, and the flag strings are split into
          # words with read -a: never eval'd, never expanded into the script.
          case_re='^[a-z0-9 ]*$'
          if ! [[ "$REQUESTED_CASE" =~ $case_re ]]; then
            echo "::error::case must match $case_re"
            exit 1
          fi
          if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ && "$SECONDS_PER_CASE" =~ ^[0-9]+$ && "$CASE_PARALLELISM" =~ ^[0-9]*$ ]]; then
            echo "::error::max_pages, seconds_per_case and case_parallelism must be whole numbers"
            exit 1
          fi
          mkdir -p out
          capture() {
            local -a flags=() on_flags=()
            read -r -a flags <<< "$BASE_ARGS"
            if [ "$2" = on ]; then
              read -r -a on_flags <<< "$EXTRA_ARGS"
              flags+=(${on_flags[@]+"${on_flags[@]}"})
            fi
            .venv/bin/python -m evaluation.research.live --live --out "out/$1-$2" \
              --case "$1" --seconds-per-case "$SECONDS_PER_CASE" \
              --max-pages "$MAX_PAGES" $MEASUREMENT_BINDINGS ${flags[@]+"${flags[@]}"} \
              --search-provider "$UNIMATCH_SEARCH_PROVIDER" ${SEARCH_CAP_ARGS:-} | tail -n 2
          }
          cases="$REQUESTED_CASE"
          jobs="$CASE_PARALLELISM"
          if [ "${PAIRED_COLUMNS:-4}" = 1 ]; then
            # The record run: one capture per case, the "on" arm only.
            single() { capture "$1" on; }
            export -f capture single
            export MEASUREMENT_BINDINGS UNIMATCH_SEARCH_PROVIDER SEARCH_CAP_ARGS
            printf '%s\n' $cases | xargs -P "${jobs:-1}" -I{} bash -c 'single "$1" > "out/log-$1.txt" 2>&1; echo "== $1"; cat "out/log-$1.txt"' _ {}
            order="single-on-${jobs:-1}"
          elif [ "${jobs:-1}" -le 1 ]; then
            for c in $cases; do capture "$c" off; capture "$c" on; done
            for c in $(printf '%s\n' $cases | tac); do capture "$c" on; capture "$c" off; done
            order=two-pass
          else
            # Universities in parallel, each one ABBA on its own. As in the
            # serial order, a failed capture does not stop the others: the
            # observation records the error and the scorecard counts it.
            abba() { capture "$1" off; capture "$1" on; capture "$1" on; capture "$1" off; }
            export -f capture abba
            export MEASUREMENT_BINDINGS UNIMATCH_SEARCH_PROVIDER SEARCH_CAP_ARGS
            printf '%s\n' $cases | xargs -P "$jobs" -I{} bash -c 'abba "$1" > "out/log-$1.txt" 2>&1; echo "== $1"; cat "out/log-$1.txt"' _ {}
            order="abba-parallel-$jobs"
          fi
          echo "extra_args=$EXTRA_ARGS base_args=$BASE_ARGS bindings=$MEASUREMENT_BINDINGS order=$order" >> out/config.txt
          if [ -f out/search_ledger.json ]; then
            echo "search_ledger=$(tr -d ' \n' < out/search_ledger.json)" >> out/config.txt
          fi

      - name: Build the recorded-search v2 store (make_v2_store)
        # W4: after a single-column record run on a keyed provider, turn the
        # captures' <case>.search.json logs into recorded-search/2 (titles and
        # snippets) beside them. Development sets only: the builder globs the
        # cohort/dev2/dev3/dev4 ids and never lists another case's files. A
        # failed build does not lose the captures; rebuild locally from the
        # artifact (docs/process/RECORD_RUN_2026-10-19.md).
        if: inputs.mode == 'expert_paired' && inputs.columns == '1'
        continue-on-error: true
        env:
          REQUESTED_CASE: ${{ inputs.case }}
          STORE_TAG: ${{ inputs.run_tag || 'record' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$UNIMATCH_SEARCH_PROVIDER" in
            none|recorded) echo "make_v2_store skipped: $UNIMATCH_SEARCH_PROVIDER returned no result list"; exit 0 ;;
          esac
          if ! [[ "$STORE_TAG" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::run_tag '$STORE_TAG' is not a file-name token; store not built"
            exit 1
          fi
          read -r -a cases <<< "$REQUESTED_CASE"
          .venv/bin/python -m evaluation.research.recorded_search \
            --record-run "$RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(git rev-parse HEAD)" out \
            --cases "${cases[@]}" --out "out/recorded_search.$STORE_TAG.json"

      - name: Validate the resume request
        if: inputs.mode == 'expert_actions' && inputs.resume_run_id != ''
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          .venv/bin/python - <<'PY'
          import json, os, re
          run_id = os.environ['RESUME_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('resume_run_id must be a positive numeric workflow run ID')
          plan = json.loads(os.environ['PLAN_JSON'])
          summary = plan.get('resume_summary')
          if not plan.get('strict_budget') or not isinstance(summary, dict) or not summary.get('raw_logs'):
              raise SystemExit('Resume requires a strict plan and independently hashed previous raw logs')
          PY

      - name: Restore the preceding controlled raw logs
        if: inputs.mode == 'expert_actions' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: expert-recovery-${{ inputs.resume_run_id }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: backend/out/preceding

      - name: Execute an expert plan
        if: inputs.mode == 'expert_actions'
        run: |
          set -o pipefail
          mkdir -p out
          if [ -d out/preceding ]; then
            test -d out/preceding/logs
            test ! -e out/logs
            mv out/preceding/logs out/logs
            rm -rf out/preceding
          fi
          printf '%s' "$PLAN_JSON" > out/plan.json
          .venv/bin/python -m evaluation.research.expert.controller \
            --plan out/plan.json --logs-dir out/logs --cache-dir out/cache \
            --summary out/summary.json
          rm -rf out/cache

      - name: Return everything in the log
        if: always()
        run: |
          tar -czf bundle.tgz out || true
          sha256sum bundle.tgz
          echo "BUNDLE_BEGIN"
          base64 -w 4000 bundle.tgz | sed 's/^/B64 /'
          echo "BUNDLE_END"

      - name: Preserve independently recorded expert evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-recovery-${{ github.run_id }}
          path: backend/out
          if-no-files-found: warn
          retention-days: 14

  # Finish plan v2, track A: experts draft the core answers with a URL and a
  # verbatim quote; before the owner signs, the production Fetcher must open
  # every page and find every quote word for word. The agent's container
  # cannot do this (Fetcher refuses the proxy by design), so it runs here.
  # mode=verify_evidence; extra_args carries the drafts directory or file,
  # relative to backend/ (default: the 2026-10-17 core drafts).
  verify:
    if: inputs.mode == 'verify_evidence'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - name: Check every quote with the production fetcher
        env:
          DRAFTS: ${{ inputs.extra_args || 'evaluation/research/expert/data/core_drafts.2026-10-17' }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/evidence-check
          .venv/bin/python scripts/verify_evidence.py "$DRAFTS" \
            --out ../artifacts/evidence-check/report.json \
            | tee ../artifacts/evidence-check/report.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-check-${{ github.run_id }}
          path: artifacts/evidence-check/
          if-no-files-found: error

  # Plan v3 M5 (ticket 07): five query shapes x six local-language development
  # cases through the Serper adapter, at most 300 queries (the script refuses
  # more before sending any). mode=query_probe; extra_args are extra probe
  # flags (e.g. --cases uba puc uio kuleuven psaclay ucph). The key is a
  # secret, read by the adapter from the environment and never printed.
  query_probe:
    if: inputs.mode == 'query_probe'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      UNIMATCH_SEARCH_PROVIDER: serper
      UNIMATCH_SERPER_API_KEY: ${{ secrets.UNIMATCH_SERPER_API_KEY }}
      UNIMATCH_DEMO_MODE: 'false'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - name: Require the Serper key
        run: |
          if [ -z "$UNIMATCH_SERPER_API_KEY" ]; then
            echo "::error::query_probe needs the UNIMATCH_SERPER_API_KEY secret; nothing was sent"
            exit 1
          fi
          echo "search provider: serper (key present)"
      - name: Probe the query shapes
        env:
          PROBE_ARGS: ${{ inputs.extra_args }}
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/query-probe
          # PROBE_ARGS is split on spaces on purpose: it carries flags.
          # shellcheck disable=SC2086
          .venv/bin/python scripts/probe_query_shapes.py --live \
            --out ../artifacts/query-probe $PROBE_ARGS \
            | tee ../artifacts/query-probe/probe.log
          cat ../artifacts/query-probe/probe.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-probe-${{ github.run_id }}
          path: artifacts/query-probe/
          if-no-files-found: error
          retention-days: 14

  # Free-search map ticket 04: the ceiling of an own index. Reads public
  # robots.txt, sitemaps and pages of the development gold and the knowledge
  # base's evidence URLs through the production Fetcher (our user agent,
  # robots.txt, Crawl-delay; nothing retried around a refusal). No search
  # provider and no secret. mode=index_ceiling; extra_args are tool flags (the
  # self-hosted re-run: --refused-from <report.json committed or downloaded>).
  index_ceiling:
    if: inputs.mode == 'index_ceiling'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    env:
      UNIMATCH_DEMO_MODE: 'false'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - name: Measure the sitemap / two-hop ceiling
        env:
          CEILING_ARGS: ${{ inputs.extra_args }}
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/index-ceiling
          # CEILING_ARGS is split on spaces on purpose: it carries flags.
          # shellcheck disable=SC2086
          .venv/bin/python -m evaluation.research.index_ceiling \
            --out ../artifacts/index-ceiling/report.json \
            --markdown ../artifacts/index-ceiling/tables.md $CEILING_ARGS \
            | tee ../artifacts/index-ceiling/run.log
          cat ../artifacts/index-ceiling/tables.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-ceiling-${{ github.run_id }}
          path: artifacts/index-ceiling/
          if-no-files-found: error
          retention-days: 14
