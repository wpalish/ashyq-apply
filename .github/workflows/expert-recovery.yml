# Expert recovery: the live half of backend/evaluation/research/expert.
#
# The agent container cannot run Fetcher (it pins IPs and refuses the proxy),
# so every live read for the expert protocol happens here and comes back in
# the job log as a base64 tarball the run controller decodes.
#
#   mode=baseline  bounded capture of the current pipeline for one case, then
#                  a blinded packet. It does NOT score against the corpus: the
#                  controller opens gold only after the expert trace is fixed.
#   mode=actions   execute an expert's plan (replay prefix + chosen actions)
#                  through the production Fetcher / search seam, one numbered
#                  raw log per call, hashed on this runner.
#
# Manual only; never commits anything.
name: expert-recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'baseline or actions'
        required: true
        default: 'baseline'
      case:
        description: 'Cohort id (baseline mode), e.g. kaist'
        required: false
        default: ''
      seconds_per_case:
        required: false
        default: '120'
      max_pages:
        required: false
        default: '60'
      plan:
        description: 'actions mode: the plan JSON (see evaluation/research/expert/controller.py)'
        required: false
        default: ''
      extra_args:
        description: 'baseline mode: extra evaluation.research.live flags (experiment switches)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      UNIMATCH_SEARCH_PROVIDER: ${{ secrets.UNIMATCH_SERPER_API_KEY != '' && 'serper' || (secrets.UNIMATCH_BRAVE_API_KEY != '' && 'brave' || (secrets.UNIMATCH_TAVILY_API_KEY != '' && 'tavily' || (secrets.UNIMATCH_EXA_API_KEY != '' && 'exa' || 'none'))) }}
      UNIMATCH_EXA_API_KEY: ${{ secrets.UNIMATCH_EXA_API_KEY }}
      UNIMATCH_TAVILY_API_KEY: ${{ secrets.UNIMATCH_TAVILY_API_KEY }}
      UNIMATCH_BRAVE_API_KEY: ${{ secrets.UNIMATCH_BRAVE_API_KEY }}
      UNIMATCH_SERPER_API_KEY: ${{ secrets.UNIMATCH_SERPER_API_KEY }}
      UNIMATCH_DEMO_MODE: 'false'
      UNIMATCH_ENABLE_BROWSER_TIER: 'false'
      UNIMATCH_FETCH_CONTACT: 'https://github.com/wpalish/ashyq-apply'
      PLAN_JSON: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -q -r requirements-dev.txt
      - name: Provider
        run: echo "search provider: $UNIMATCH_SEARCH_PROVIDER; sha $(git rev-parse HEAD)"

      - name: Baseline capture and blinded packet
        if: inputs.mode == 'baseline'
        run: |
          set -o pipefail
          mkdir -p out
          .venv/bin/python -m evaluation.research.live --live --out out/capture \
            --case "${{ inputs.case }}" \
            --seconds-per-case "${{ inputs.seconds_per_case }}" \
            --max-pages "${{ inputs.max_pages }}" ${{ inputs.extra_args }} | tee out/capture.log
          CAPTURE="$(tail -n 1 out/capture.log)"
          test -f "$CAPTURE"
          .venv/bin/python -m evaluation.research.expert prepare \
            --dataset evaluation/research/data/ground_truth.reviewed.json \
            --capture "$CAPTURE" --case "${{ inputs.case }}" \
            --out out/packet.json
          echo "provider=$UNIMATCH_SEARCH_PROVIDER" > out/config.txt
          echo "extra_args=${{ inputs.extra_args }}" >> out/config.txt

      - name: Execute an expert plan
        if: inputs.mode == 'actions'
        run: |
          set -o pipefail
          mkdir -p out
          printf '%s' "$PLAN_JSON" > out/plan.json
          .venv/bin/python -m evaluation.research.expert.controller \
            --plan out/plan.json --logs-dir out/logs --cache-dir out/cache \
            --summary out/summary.json
          rm -rf out/cache

      - name: Return everything in the log
        if: always()
        run: |
          tar -czf bundle.tgz out || true
          sha256sum bundle.tgz
          echo "BUNDLE_BEGIN"
          base64 -w 4000 bundle.tgz | sed 's/^/B64 /'
          echo "BUNDLE_END"
