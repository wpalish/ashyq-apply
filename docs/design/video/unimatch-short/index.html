<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F3F2EF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-02-logo"
        class="scene"
        data-composition-id="02-logo"
        data-composition-src="compositions/frames/02-logo.html"
        data-start="3"
        data-duration="2"
        data-track-index="1"
      ></div>

      <div
        id="el-03-routes"
        class="scene"
        data-composition-id="03-routes"
        data-composition-src="compositions/frames/03-routes.html"
        data-start="5"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-04-passes"
        class="scene"
        data-composition-id="04-passes"
        data-composition-src="compositions/frames/04-passes.html"
        data-start="9"
        data-duration="2"
        data-track-index="1"
      ></div>

      <div
        id="el-05-money"
        class="scene"
        data-composition-id="05-money"
        data-composition-src="compositions/frames/05-money.html"
        data-start="11"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-06-answers"
        class="scene"
        data-composition-id="06-answers"
        data-composition-src="compositions/frames/06-answers.html"
        data-start="15"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-07-decide"
        class="scene"
        data-composition-id="07-decide"
        data-composition-src="compositions/frames/07-decide.html"
        data-start="19"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-08-plan"
        class="scene"
        data-composition-id="08-plan"
        data-composition-src="compositions/frames/08-plan.html"
        data-start="22"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-09-end"
        class="scene"
        data-composition-id="09-end"
        data-composition-src="compositions/frames/09-end.html"
        data-start="25"
        data-duration="5"
        data-track-index="1"
      ></div>

      <audio id="bgm" src="assets/audio/unimatch-bed.mp3" data-start="0" data-duration="30" data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
